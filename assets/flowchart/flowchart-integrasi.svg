<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1850" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-start" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-mod-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-mod-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-decision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="grad-end" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Filters for soft shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .label-title { font-size: 20px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .label-sub { font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .node-text { font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .node-subtext { font-size: 11px; fill: #e2e8f0; text-anchor: middle; }
    .flow-line { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .flow-loop { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 5,5; fill: none; marker-end: url(#arrow); }
    .branch-label { font-size: 11px; font-weight: 700; fill: #cbd5e1; }
    .badge-pill { font-size: 10px; font-weight: 700; fill: #f8fafc; }
  </style>

  <!-- Title Card -->
  <text x="460" y="40" class="label-title">FLOWCHART PROGRAM TERINTEGRASI</text>
  <text x="460" y="62" class="label-sub">Studi Kasus 07 · Sistem Pendaftaran &amp; Rekapitulasi Seminar Nasional (Modul A + Modul B)</text>

  <!-- 1. Start (Terminator) -->
  <g filter="url(#shadow)">
    <rect x="360" y="85" width="200" height="42" rx="21" fill="url(#grad-start)"/>
    <text x="460" y="111" class="node-text">MULAI</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 460 127 L 460 155" class="flow-line"/>

  <!-- 2. Init Akumulator (Process - Modul B) -->
  <g filter="url(#shadow)">
    <rect x="230" y="155" width="460" height="58" rx="8" fill="url(#grad-mod-b)"/>
    <text x="460" y="178" class="node-text">Inisialisasi Seluruh Akumulator Modul B</text>
    <text x="460" y="196" class="node-subtext">totalMhs=0, totalDsn=0, totalUmum=0, totalEB=0, totalKlp=0,</text>
    <text x="460" y="209" class="node-subtext">totalSertif=0, totalMakan=0, totalDiskon=0, totalPendapatan=0, no=1</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 460 213 L 460 245" class="flow-line"/>

  <!-- 3. Loop Decision -->
  <g filter="url(#shadow)">
    <polygon points="460,245 590,295 460,345 330,295" fill="url(#grad-decision)"/>
    <text x="460" y="291" class="node-text">lanjut == 'Y'?</text>
    <text x="460" y="307" class="node-subtext">(Perulangan Utama)</text>
  </g>

  <text x="470" y="365" class="branch-label">Ya (Proses Peserta)</text>
  <text x="605" y="288" class="branch-label" style="fill:#f87171;">Tidak (Selesai Transaksi)</text>

  <!-- Flow 3 -> 4 -->
  <path d="M 460 345 L 460 385" class="flow-line"/>

  <!-- 4. Input & Validasi (Modul A) -->
  <g filter="url(#shadow)">
    <polygon points="260,385 700,385 650,465 210,465" fill="url(#grad-mod-a)"/>
    <text x="455" y="411" class="node-text">[MODUL A] Input Data Peserta &amp; Validasi Ketat</text>
    <text x="455" y="429" class="node-subtext">Baca &amp; Validasi: namaPeserta (!= ""), kategori (1,2,3),</text>
    <text x="455" y="445" class="node-subtext">statusEB ('Y'/'T'), jumlahAnggota (&gt;0), statusSertif ('Y'/'T'), statusMakan ('Y'/'T')</text>
  </g>

  <!-- Flow 4 -> 5 -->
  <path d="M 460 465 L 460 495" class="flow-line"/>

  <!-- 5. Decision Kategori -->
  <g filter="url(#shadow)">
    <polygon points="460,495 570,535 460,575 350,535" fill="url(#grad-decision)"/>
    <text x="460" y="539" class="node-text">Pilihan Kategori?</text>
  </g>

  <!-- Branches Kategori -->
  <path d="M 350 535 L 210 535 L 210 595" class="flow-line"/>
  <text x="240" y="528" class="branch-label">1: Mahasiswa</text>
  <g filter="url(#shadow)">
    <rect x="130" y="595" width="160" height="38" rx="6" fill="url(#grad-mod-a)"/>
    <text x="210" y="618" class="node-text">tarif = 75.000</text>
  </g>

  <path d="M 460 575 L 460 595" class="flow-line"/>
  <text x="468" y="588" class="branch-label">2: Dosen</text>
  <g filter="url(#shadow)">
    <rect x="380" y="595" width="160" height="38" rx="6" fill="url(#grad-mod-a)"/>
    <text x="460" y="618" class="node-text">tarif = 125.000</text>
  </g>

  <path d="M 570 535 L 710 535 L 710 595" class="flow-line"/>
  <text x="615" y="528" class="branch-label">3: Umum</text>
  <g filter="url(#shadow)">
    <rect x="630" y="595" width="160" height="38" rx="6" fill="url(#grad-mod-a)"/>
    <text x="710" y="618" class="node-text">tarif = 175.000</text>
  </g>

  <!-- Merge Kategori -->
  <path d="M 210 633 L 210 660 L 460 660" style="stroke: #94a3b8; stroke-width: 2; fill: none;"/>
  <path d="M 710 633 L 710 660 L 460 660" style="stroke: #94a3b8; stroke-width: 2; fill: none;"/>
  <path d="M 460 633 L 460 680" class="flow-line"/>

  <!-- 6. Decision Early Bird -->
  <g filter="url(#shadow)">
    <polygon points="460,680 570,715 460,750 350,715" fill="url(#grad-decision)"/>
    <text x="460" y="719" class="node-text">earlyBird == true?</text>
  </g>

  <path d="M 350 715 L 250 715 L 250 770" class="flow-line"/>
  <text x="275" y="707" class="branch-label">Ya (20%)</text>
  <g filter="url(#shadow)">
    <rect x="150" y="770" width="200" height="42" rx="6" fill="url(#grad-mod-a)"/>
    <text x="250" y="788" class="node-text">diskonEB = tarif × 0.20</text>
    <text x="250" y="804" class="node-subtext">tarifSetelahEB = tarif - diskonEB</text>
  </g>

  <path d="M 570 715 L 670 715 L 670 770" class="flow-line"/>
  <text x="595" y="707" class="branch-label">Tidak (0%)</text>
  <g filter="url(#shadow)">
    <rect x="570" y="770" width="200" height="42" rx="6" fill="url(#grad-mod-a)"/>
    <text x="670" y="788" class="node-text">diskonEB = 0</text>
    <text x="670" y="804" class="node-subtext">tarifSetelahEB = tarif</text>
  </g>

  <!-- Merge EB -->
  <path d="M 250 812 L 250 840 L 460 840" style="stroke: #94a3b8; stroke-width: 2; fill: none;"/>
  <path d="M 670 812 L 670 840 L 460 840" style="stroke: #94a3b8; stroke-width: 2; fill: none;"/>
  <path d="M 460 840 L 460 860" class="flow-line"/>

  <!-- 7. Decision Diskon Kelompok -->
  <g filter="url(#shadow)">
    <polygon points="460,860 580,895 460,930 340,895" fill="url(#grad-decision)"/>
    <text x="460" y="899" class="node-text">jumlahAnggota &gt;= 5?</text>
  </g>

  <path d="M 340 895 L 250 895 L 250 950" class="flow-line"/>
  <text x="265" y="887" class="branch-label">Ya (10%)</text>
  <g filter="url(#shadow)">
    <rect x="140" y="950" width="220" height="42" rx="6" fill="url(#grad-mod-a)"/>
    <text x="250" y="968" class="node-text">diskonKlp = tarifSetelahEB × 0.10</text>
    <text x="250" y="984" class="node-subtext">tarifBersih = tarifSetelahEB - diskonKlp</text>
  </g>

  <path d="M 580 895 L 670 895 L 670 950" class="flow-line"/>
  <text x="600" y="887" class="branch-label">Tidak (0%)</text>
  <g filter="url(#shadow)">
    <rect x="560" y="950" width="220" height="42" rx="6" fill="url(#grad-mod-a)"/>
    <text x="670" y="968" class="node-text">diskonKlp = 0</text>
    <text x="670" y="984" class="node-subtext">tarifBersih = tarifSetelahEB</text>
  </g>

  <!-- Merge Kelompok -->
  <path d="M 250 992 L 250 1020 L 460 1020" style="stroke: #94a3b8; stroke-width: 2; fill: none;"/>
  <path d="M 670 992 L 670 1020 L 460 1020" style="stroke: #94a3b8; stroke-width: 2; fill: none;"/>
  <path d="M 460 1020 L 460 1040" class="flow-line"/>

  <!-- 8. Biaya Tambahan & Total Tagihan (Modul A) -->
  <g filter="url(#shadow)">
    <rect x="250" y="1040" width="420" height="66" rx="8" fill="url(#grad-mod-a)"/>
    <text x="460" y="1063" class="node-text">[MODUL A] Hitung Biaya Tambahan &amp; Tagihan Peserta</text>
    <text x="460" y="1081" class="node-subtext">tambahan = (sertif ? 20.000 : 0) + (makan ? 35.000 : 0)</text>
    <text x="460" y="1097" class="node-subtext">totalTagihan = tarifBersih + tambahan (biaya tambahan tanpa diskon)</text>
  </g>

  <!-- Flow 8 -> 9 -->
  <path d="M 460 1106 L 460 1130" class="flow-line"/>

  <!-- 9. Akumulasi Rekapitulasi & Pelacak Terbesar (Modul B) -->
  <g filter="url(#shadow)">
    <rect x="230" y="1130" width="460" height="68" rx="8" fill="url(#grad-mod-b)"/>
    <text x="460" y="1153" class="node-text">[MODUL B] Akumulasi Data Rekapitulasi</text>
    <text x="460" y="1171" class="node-subtext">Update: totalMhs/Dsn/Umum, totalEB, totalKlp, totalSertif, totalMakan</text>
    <text x="460" y="1187" class="node-subtext">totalDiskon += diskonPeserta, totalPendapatan += tagihan, cek tagihanTerbesar</text>
  </g>

  <!-- Flow 9 -> 10 -->
  <path d="M 460 1198 L 460 1225" class="flow-line"/>

  <!-- 10. Rincian Tagihan Output (Modul A) -->
  <g filter="url(#shadow)">
    <polygon points="270,1225 690,1225 650,1285 230,1285" fill="url(#grad-mod-a)"/>
    <text x="460" y="1250" class="node-text">[MODUL A] Tampilkan Rincian Tagihan Individual</text>
    <text x="460" y="1268" class="node-subtext">Tarif dasar, diskon EB, diskon kelompok, biaya tambahan, dan total tagihan</text>
  </g>

  <!-- Flow 10 -> 11 -->
  <path d="M 460 1285 L 460 1310" class="flow-line"/>

  <!-- 11. Tanya Lanjut Transaksi -->
  <g filter="url(#shadow)">
    <polygon points="290,1310 670,1310 630,1360 250,1360" fill="url(#grad-mod-a)"/>
    <text x="460" y="1332" class="node-text">Input: Input transaksi pendaftaran berikutnya? (Y/T)</text>
    <text x="460" y="1348" class="node-subtext">nomorUrut = nomorUrut + 1</text>
  </g>

  <!-- Loop back to 3 -->
  <path d="M 250 1335 L 90 1335 L 90 295 L 330 295" class="flow-loop"/>
  <text x="98" y="285" class="branch-label" style="fill:#38bdf8;">Ulangi jika lanjut == 'Y'</text>

  <!-- Line from Decision 3 (Tidak) to Modul B Rekapitulasi Akhir -->
  <path d="M 590 295 L 830 295 L 830 1420 L 690 1420" class="flow-line"/>

  <!-- 12. Rekapitulasi Akhir Sesi (Modul B Output) -->
  <g filter="url(#shadow)">
    <polygon points="220,1390 700,1390 650,1505 170,1505" fill="url(#grad-mod-b)"/>
    <text x="435" y="1418" class="node-text">[MODUL B] Laporan Rekapitulasi &amp; Statistik Akhir</text>
    <text x="435" y="1438" class="node-subtext">1. Distribusi jumlah peserta per kategori (% persentase)</text>
    <text x="435" y="1454" class="node-subtext">2. Kategori peserta terbanyak (analisis tie-breaker jika seri)</text>
    <text x="435" y="1470" class="node-subtext">3. Rekap kuantitas Early Bird, sertifikat, konsumsi makan</text>
    <text x="435" y="1486" class="node-subtext">4. Rekap finansial (bruto, diskon, pendapatan bersih, transaksi puncak)</text>
  </g>

  <!-- Flow 12 -> 13 -->
  <path d="M 435 1505 L 435 1545" class="flow-line"/>

  <!-- 13. Selesai (Terminator) -->
  <g filter="url(#shadow)">
    <rect x="335" y="1545" width="200" height="42" rx="21" fill="url(#grad-end)"/>
    <text x="435" y="1571" class="node-text">SELESAI</text>
  </g>

  <!-- Legenda & Keterangan Integrasi -->
  <g transform="translate(130, 1630)">
    <rect x="0" y="0" width="660" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="330" y="24" class="node-text" style="font-size:13px; fill:#cbd5e1;">LEGENDA PEMBAGIAN TANGGUNG JAWAB &amp; SIMBOL ALUR</text>

    <!-- Modul A tag -->
    <rect x="25" y="42" width="130" height="26" rx="4" fill="url(#grad-mod-a)"/>
    <text x="90" y="59" class="node-text" style="font-size:11px;">MODUL A (Proses Utama)</text>
    <text x="170" y="59" class="node-subtext" style="fill:#cbd5e1; text-anchor:start;">: Penanggung jawab Riflo Ahmad (Input, Validasi, Diskon, Rincian Tagihan)</text>

    <!-- Modul B tag -->
    <rect x="25" y="78" width="130" height="26" rx="4" fill="url(#grad-mod-b)"/>
    <text x="90" y="95" class="node-text" style="font-size:11px;">MODUL B (Rekapitulasi)</text>
    <text x="170" y="95" class="node-subtext" style="fill:#cbd5e1; text-anchor:start;">: Penanggung jawab Praysilia Sifra (Akumulator, Statistik, Tie-Breaker, Rekap Finansial)</text>

    <!-- Simbol Garis -->
    <line x1="25" y1="124" x2="85" y2="124" stroke="#94a3b8" stroke-width="2"/>
    <text x="100" y="128" class="node-subtext" style="fill:#cbd5e1; text-anchor:start;">Alur proses sekuensial</text>

    <line x1="330" y1="124" x2="390" y2="124" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="405" y="128" class="node-subtext" style="fill:#cbd5e1; text-anchor:start;">Alur perulangan transaksi berikutnya</text>

    <!-- Decision & Terminator icon -->
    <polygon points="50,148 65,140 80,148 65,156" fill="url(#grad-decision)"/>
    <text x="100" y="152" class="node-subtext" style="fill:#cbd5e1; text-anchor:start;">Percabangan kondisi logika</text>

    <rect x="330" y="142" width="60" height="16" rx="8" fill="url(#grad-end)"/>
    <text x="405" y="152" class="node-subtext" style="fill:#cbd5e1; text-anchor:start;">Titik mulai dan pengakhiran program</text>
  </g>
</svg>
